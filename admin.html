<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDUY MOD FF — Quản trị key</title><style>*{box-sizing:border-box}body{margin:0;background:#080b14;color:#eef2ff;font:15px system-ui,-apple-system,sans-serif;padding:20px}.wrap{max-width:850px;margin:auto}.card{background:#12182a;border:1px solid #303b60;border-radius:16px;padding:18px;margin:14px 0}h1{font-size:24px;margin:0 0 6px}p,.muted{color:#aab5d3}label{display:block;margin:12px 0 6px}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #3a466e;background:#0b1020;color:#fff;font:inherit}button{background:#55e8d1;color:#06121a;border:0;font-weight:800;margin-top:12px;cursor:pointer}.secondary{background:#273353;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{white-space:pre-wrap;color:#7fffd7;margin-top:10px}.keyout{font-size:18px;font-weight:800;word-break:break-all}.item{border-top:1px solid #303b60;padding:12px 0;display:grid;gap:6px}.item button{margin-top:0;background:#542a3c;color:#fff}.pill{color:#8fffe0}.small{font-size:12px}@media(max-width:560px){.row{grid-template-columns:1fr}body{padding:12px}}</style></head><body><main class="wrap"><h1>MDUY MOD FF — Quản trị key</h1><p>Trang riêng để tạo key sau khi xác nhận thanh toán.</p><section class="card"><label for="adminpass">Mật khẩu quản trị (ADMIN_PASSWORD)</label><input id="adminpass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu quản trị"><button id="login">Đăng nhập / kiểm tra</button><div id="loginmsg" class="msg"></div></section><section class="card"><h2>Tạo key mới</h2><label for="pack">Gói key</label><select id="pack"><option value="50">50 lượt — 50.000đ</option><option value="100">100 lượt — 100.000đ</option><option value="200">200 lượt — 150.000đ</option></select><button id="create">TẠO KEY</button><div id="created" hidden><p>Key mới — hãy sao chép và gửi khách ngay. Key chỉ hiện ở đây một lần.</p><div id="keytext" class="keyout"></div><button class="secondary" id="copy">Sao chép key</button></div><div id="createmsg" class="msg"></div></section><section class="card"><div class="row"><div><h2>Danh sách key</h2><p class="small">Tối đa 500 key gần nhất.</p></div><div><button class="secondary" id="refresh">Làm mới danh sách</button></div></div><div id="listmsg" class="msg"></div><div id="keys"></div></section></main><script>
const $=id=>document.getElementById(id);const base=location.origin;const pass=()=> $('adminpass').value.trim();
async function api(path,options={}){const r=await fetch(base+path,{...options,headers:{'Content-Type':'application/json','X-Admin-Password':pass(),...(options.headers||{})}});const d=await r.json().catch(()=>({error:'Phản hồi không hợp lệ'}));if(!r.ok)throw Error(d.error||'Yêu cầu thất bại');return d}
$('login').onclick=async()=>{try{await api('/api/admin/keys');$('loginmsg').textContent='Đăng nhập thành công.';await loadKeys()}catch(e){$('loginmsg').textContent=e.message}};
$('create').onclick=async()=>{ $('createmsg').textContent='';$('created').hidden=true;try{const d=await api('/api/admin/keys',{method:'POST',body:JSON.stringify({packageUses:Number($('pack').value)})});$('keytext').textContent=d.key;$('created').hidden=false;$('createmsg').textContent=`Đã tạo gói ${d.record.package_uses} lượt. Hãy sao chép key ngay.`;await loadKeys()}catch(e){$('createmsg').textContent=e.message}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('keytext').textContent);$('createmsg').textContent='Đã sao chép key.'}catch{$('createmsg').textContent='Không sao chép tự động được; hãy nhấn giữ key để sao chép.'}};
$('refresh').onclick=loadKeys;
async function loadKeys(){try{const d=await api('/api/admin/keys');$('listmsg').textContent=`Có ${d.keys.length} key gần nhất.`;$('keys').innerHTML='';for(const k of d.keys){const el=document.createElement('div');el.className='item';const status=k.revoked?'ĐÃ THU HỒI':Number(k.uses_remaining)===0?'HẾT LƯỢT':'ĐANG HOẠT ĐỘNG';const date=new Date(k.created_at).toLocaleString('vi-VN');el.innerHTML=`<strong>#${k.id} · Gói ${k.package_uses} lượt · ${Number(k.price_vnd).toLocaleString('vi-VN')}đ</strong><span>Còn: ${k.uses_remaining}/${k.package_uses} lượt · <span class="pill">${status}</span></span><span class="small">Tạo: ${date}</span>`;if(!k.revoked&&Number(k.uses_remaining)>0){const b=document.createElement('button');b.textContent='Thu hồi key';b.onclick=async()=>{if(!confirm('Thu hồi key này? Khách sẽ không dùng tiếp được.'))return;try{await api(`/api/admin/keys/${k.id}/revoke`,{method:'POST',body:'{}'});await loadKeys()}catch(e){$('listmsg').textContent=e.message}};el.appendChild(b)}$('keys').appendChild(el)}}catch(e){$('listmsg').textContent=e.message}}
</script></body></html>
