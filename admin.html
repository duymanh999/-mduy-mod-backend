<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDUY Quản lý Key</title><style>body{font:16px system-ui;background:#0b1020;color:#eef;padding:20px;max-width:760px;margin:auto}input,select,button{font:inherit;padding:10px;border-radius:8px;margin:4px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#151d35;padding:12px;border-radius:8px}.row{margin:12px 0}</style><h1>MDUY MOD FF · Quản lý key</h1><p>Nhập mật khẩu quản trị đã đặt trong Render. Không chia sẻ mật khẩu hoặc key công khai.</p><div class="row"><input id="pw" type="password" placeholder="ADMIN_PASSWORD" autocomplete="current-password"></div><div class="row"><select id="uses"><option value="50">50 lượt — 50.000đ</option><option value="100">100 lượt — 100.000đ</option><option value="200">200 lượt — 150.000đ</option></select><button id="create">Tạo key</button><button id="refresh">Tải danh sách</button></div><pre id="out">Sẵn sàng.</pre><script>const out=document.querySelector('#out'),pw=document.querySelector('#pw');async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Admin-Password':pw.value,...opts.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Lỗi HTTP '+r.status);return d}document.querySelector('#create').onclick=async()=>{try{const d=await api('/api/admin/keys',{method:'POST',body:JSON.stringify({packageUses:Number(document.querySelector('#uses').value)})});out.textContent='KEY MỚI (chỉ hiện lần này, hãy lưu lại):\n'+d.key+'\n\nThông tin: '+JSON.stringify(d.record,null,2)}catch(e){out.textContent=e.message}};document.querySelector('#refresh').onclick=async()=>{try{const d=await api('/api/admin/keys');out.textContent=JSON.stringify(d.keys,null,2)}catch(e){out.textContent=e.message}}</script></html>
